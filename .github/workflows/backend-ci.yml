name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "contracts/**"
      - "infra/compose.yaml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "contracts/**"
      - "infra/compose.yaml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install Python
        run: uv python install
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src tests scripts
      - name: Test
        run: uv run pytest
      - name: Check generated OpenAPI contracts
        run: uv run python scripts/export_openapi.py --check
      - name: Build package
        run: uv build

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Build backend image
        run: docker compose -f infra/compose.yaml build backend
