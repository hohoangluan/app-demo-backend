name: app-demo

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_demo}
      POSTGRES_USER: ${POSTGRES_USER:-app_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_demo_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-app_demo}" -d "${POSTGRES_DB:-app_demo}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: app-demo-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app_demo}:${POSTGRES_PASSWORD:-app_demo_dev_only}@postgres:5432/${POSTGRES_DB:-app_demo}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: app-demo-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app_demo}:${POSTGRES_PASSWORD:-app_demo_dev_only}@postgres:5432/${POSTGRES_DB:-app_demo}
      PUBLIC_API_TOKEN_HASH: ${PUBLIC_API_TOKEN_HASH:-replace-with-derived-public-token-hash}
      PUBLIC_API_CLIENT_ID: ${PUBLIC_API_CLIENT_ID:-replace-with-a-public-client-id}
      PUBLIC_API_SCOPES: ${PUBLIC_API_SCOPES:-service:execute,requests:read}
      DEVICE_API_TOKEN_HASH: ${DEVICE_API_TOKEN_HASH:-replace-with-derived-device-token-hash}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-replace-with-a-urlsafe-base64-encoded-32-byte-key}
      DELIVERY_TRANSPORT: ${DELIVERY_TRANSPORT:-fake}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-0.5}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      DELIVERY_LEASE_SECONDS: ${DELIVERY_LEASE_SECONDS:-30}
      CALLBACK_LEASE_SECONDS: ${CALLBACK_LEASE_SECONDS:-30}
      DEMO_TIME_SCALE: ${DEMO_TIME_SCALE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${HTTP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
