openapi: 3.1.0
info:
  title: App Communication Server Device API
  version: 0.1.0
paths:
  /api/v1/device/register:
    post:
      summary: Register Device
      description: Describe the Android device registration endpoint contract.
      operationId: register_device_api_v1_device_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_DeviceRegisterData_'
      security:
      - DeviceBearerAuth: []
  /api/v1/device/report:
    post:
      summary: Report Device Result
      description: Describe the Android device report endpoint contract.
      operationId: report_device_result_api_v1_device_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceReportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_DeviceReportData_'
      security:
      - DeviceBearerAuth: []
  /api/v1/device/event:
    post:
      summary: Post Device Event
      description: Describe the spontaneous Android event endpoint contract.
      operationId: post_device_event_api_v1_device_event_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEventRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_DeviceEventData_'
      security:
      - DeviceBearerAuth: []
  /api/v1/device/glasses/link:
    post:
      summary: Link Glasses Device
      description: Describe the glasses pairing endpoint contract.
      operationId: link_glasses_device_api_v1_device_glasses_link_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlassesLinkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_GlassesLinkData_'
      security:
      - DeviceBearerAuth: []
  /api/v1/device/glasses/unlink:
    post:
      summary: Unlink Glasses Device
      description: Describe the glasses unpairing endpoint contract.
      operationId: unlink_glasses_device_api_v1_device_glasses_unlink_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlassesUnlinkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_GlassesUnlinkData_'
      security:
      - DeviceBearerAuth: []
components:
  schemas:
    Action:
      type: string
      enum:
      - ride_quote
      - ride_confirm
      - music_play
      - music_stop
      - music_volume
      - navigation_start
      - navigation_stop
      - emergency_call
      - contact_call
      - location_get
      - capabilities_get
      - call_answer
      - call_reject
      title: Action
      description: Internal handler actions corresponding one-to-one with operations.
    DeviceEventData:
      properties:
        device_id:
          type: string
          title: Device Id
        glasses_device_id:
          type: string
          title: Glasses Device Id
        event_forwarded:
          type: boolean
          const: true
          title: Event Forwarded
          default: true
      additionalProperties: false
      type: object
      required:
      - device_id
      - glasses_device_id
      title: DeviceEventData
      description: Acknowledgement after an event has reached the glasses server.
    DeviceEventRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        type:
          type: string
          enum:
          - call_incoming
          - call_ended
          title: Type
        caller:
          anyOf:
          - $ref: '#/components/schemas/IncomingCaller'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - device_id
      - type
      title: DeviceEventRequest
      description: Spontaneous Android event; deliberately has no action request_id.
    DeviceExecutionError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - details
      title: DeviceExecutionError
      description: Action execution error reported by the device.
    DeviceRegisterData:
      properties:
        device_id:
          type: string
          title: Device Id
        registered:
          type: boolean
          const: true
          title: Registered
          default: true
      additionalProperties: false
      type: object
      required:
      - device_id
      title: DeviceRegisterData
      description: Successful device registration result.
    DeviceRegisterRequest:
      properties:
        user_id:
          type: string
          title: User Id
        device_id:
          type: string
          title: Device Id
        platform:
          type: string
          const: android
          title: Platform
        push_token:
          type: string
          title: Push Token
      additionalProperties: false
      type: object
      required:
      - user_id
      - device_id
      - platform
      - push_token
      title: DeviceRegisterRequest
      description: Register or update an Android device delivery token.
    DeviceReportData:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        report_received:
          type: boolean
          const: true
          title: Report Received
          default: true
      additionalProperties: false
      type: object
      required:
      - request_id
      title: DeviceReportData
      description: Successful device report acknowledgement.
    DeviceReportRequest:
      properties:
        user_id:
          type: string
          title: User Id
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        action:
          $ref: '#/components/schemas/Action'
        execution_state:
          $ref: '#/components/schemas/ExecutionState'
        result:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/JsonValue'
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - $ref: '#/components/schemas/DeviceExecutionError'
          - type: 'null'
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      additionalProperties: false
      type: object
      required:
      - user_id
      - device_id
      - request_id
      - action
      - execution_state
      - timestamp
      title: DeviceReportRequest
      description: Report the terminal outcome of a device action.
    ExecutionState:
      type: string
      enum:
      - succeeded
      - failed
      title: ExecutionState
      description: Terminal execution states reported by Android.
    GlassesLinkData:
      properties:
        device_id:
          type: string
          title: Device Id
        linked:
          type: boolean
          const: true
          title: Linked
          default: true
      additionalProperties: false
      type: object
      required:
      - device_id
      title: GlassesLinkData
      description: Result of a successful glasses pairing.
    GlassesLinkRequest:
      properties:
        user_id:
          type: string
          title: User Id
        device_id:
          type: string
          title: Device Id
      additionalProperties: false
      type: object
      required:
      - user_id
      - device_id
      title: GlassesLinkRequest
      description: Pair a glasses device_id to the given app user_id.
    GlassesUnlinkData:
      properties:
        unlinked:
          type: boolean
          title: Unlinked
      additionalProperties: false
      type: object
      required:
      - unlinked
      title: GlassesUnlinkData
      description: 'Result of an unlink attempt: whether an active pairing was cleared.'
    GlassesUnlinkRequest:
      properties:
        user_id:
          type: string
          title: User Id
      additionalProperties: false
      type: object
      required:
      - user_id
      title: GlassesUnlinkRequest
      description: Unpair whichever glasses device_id is currently active for user_id.
    IncomingCaller:
      properties:
        contact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        number_tail:
          anyOf:
          - type: string
          - type: 'null'
          title: Number Tail
        duplicate_name:
          type: boolean
          title: Duplicate Name
          default: false
      additionalProperties: false
      type: object
      title: IncomingCaller
      description: Caller identity after the phone has removed the full phone number.
    JsonValue: {}
    OkResponse_DeviceEventData_:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/DeviceEventData'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[DeviceEventData]
    OkResponse_DeviceRegisterData_:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/DeviceRegisterData'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[DeviceRegisterData]
    OkResponse_DeviceReportData_:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/DeviceReportData'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[DeviceReportData]
    OkResponse_GlassesLinkData_:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/GlassesLinkData'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[GlassesLinkData]
    OkResponse_GlassesUnlinkData_:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/GlassesUnlinkData'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[GlassesUnlinkData]
  securitySchemes:
    DeviceBearerAuth:
      type: http
      scheme: bearer
