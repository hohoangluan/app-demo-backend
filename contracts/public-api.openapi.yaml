openapi: 3.1.0
info:
  title: App Communication Server Public API
  version: 0.1.0
paths:
  /api/v1/service/ride/quote:
    post:
      summary: Ride Quote
      description: Describe the ride quote endpoint contract.
      operationId: ride_quote_api_v1_service_ride_quote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideQuoteRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/ride/confirm:
    post:
      summary: Ride Confirm
      description: Describe the ride confirmation endpoint contract.
      operationId: ride_confirm_api_v1_service_ride_confirm_post
