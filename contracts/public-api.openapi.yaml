        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/contact/call:
    post:
      summary: Contact Call
      description: Describe the contact call endpoint contract.
      operationId: contact_call_api_v1_service_contact_call_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCallRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/location/get:
    post:
      summary: Location Get
      description: Describe the device location lookup endpoint contract.
      operationId: location_get_api_v1_service_location_get_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationGetRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/call/answer:
    post:
      summary: Call Answer
      description: Describe the incoming-call answer endpoint contract.
      operationId: call_answer_api_v1_service_call_answer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallAnswerRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/call/reject:
    post:
      summary: Call Reject
      description: Describe the incoming-call rejection endpoint contract.
      operationId: call_reject_api_v1_service_call_reject_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallRejectRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
