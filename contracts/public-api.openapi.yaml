              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/navigation/stop:
    post:
      summary: Navigation Stop
      description: Describe the navigation stop endpoint contract.
      operationId: navigation_stop_api_v1_service_navigation_stop_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationStopRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: INVALID_REQUEST
                  message: Invalid request
                  details: {}
      security:
      - PublicBearerAuth: []
  /api/v1/service/emergency/call:
    post:
      summary: Emergency Call
      description: Describe the emergency call endpoint contract.
      operationId: emergency_call_api_v1_service_emergency_call_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyCallRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
