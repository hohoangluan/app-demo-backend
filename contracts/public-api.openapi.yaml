  /api/v1/service/capabilities:
    post:
      summary: Capabilities Get
      description: Describe the Android capability snapshot endpoint contract.
      operationId: capabilities_get_api_v1_service_capabilities_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilitiesGetRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_AcceptedData_'
        '400':
