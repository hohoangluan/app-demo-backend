      - PublicBearerAuth: []
  /api/v1/requests/{request_id}:
    get:
      summary: Request Status
      description: Describe the Public Request Status endpoint contract.
      operationId: request_status_api_v1_requests__request_id__get
      security:
      - PublicBearerAuth: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse_RequestStatusData_ActionResult__'
components:
  schemas:
    AcceptedData:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        operation:
          $ref: '#/components/schemas/Operation'
        request_state:
          type: string
          const: processing
          title: Request State
          default: processing
        status_url:
          type: string
          title: Status Url
        accepted_at:
          type: string
          format: date-time
          title: Accepted At
      additionalProperties: false
      type: object
      required:
      - request_id
      - operation
      - status_url
      - accepted_at
      title: AcceptedData
      description: Data returned after a function request is accepted.
    ActionResult:
      anyOf:
      - $ref: '#/components/schemas/RideQuoteResult'
      - $ref: '#/components/schemas/RideConfirmResult'
      - $ref: '#/components/schemas/MusicPlayResult'
      - $ref: '#/components/schemas/MusicStopResult'
      - $ref: '#/components/schemas/MusicVolumeResult'
      - $ref: '#/components/schemas/NavigationStartResult'
      - $ref: '#/components/schemas/NavigationStopResult'
      - $ref: '#/components/schemas/EmergencyCallResult'
      - $ref: '#/components/schemas/ContactCallResult'
      - $ref: '#/components/schemas/LocationGetResult'
    CallAnswerRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: CallAnswerRequest
      description: Answer the currently ringing phone call.
    CallRejectRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: CallRejectRequest
      description: Reject the currently ringing phone call.
    CapabilitiesGetRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: CapabilitiesGetRequest
      description: Request the Android client's fixed capability snapshot.
    ContactCallRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        name:
          type: string
          title: Name
        contact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      - name
      title: ContactCallRequest
      description: Call exactly one contact selected by name.
    ContactCallResult:
      properties:
        call_state:
          type: string
          const: calling
          title: Call State
        contact_name:
          type: string
          title: Contact Name
        phone_number:
          type: string
          title: Phone Number
      additionalProperties: false
      type: object
      required:
      - call_state
      - contact_name
      - phone_number
      title: ContactCallResult
      description: Final result after calling one uniquely matched contact.
    CurrentLocation:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      additionalProperties: false
      type: object
      required:
      - lat
      - lng
      title: CurrentLocation
      description: Current device location with contract-defined coordinate bounds.
    Destination:
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
        lng:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lng
      additionalProperties: false
      type: object
      title: Destination
      description: Destination represented by an address, a coordinate pair, or both.
    EmergencyCallRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        number:
          anyOf:
          - type: string
          - type: 'null'
          title: Number
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: EmergencyCallRequest
      description: Start the configured emergency call flow.
    EmergencyCallResult:
      properties:
        emergency_state:
          type: string
          title: Emergency State
        attempt:
          type: integer
          title: Attempt
        answered:
          type: boolean
          title: Answered
        cycle:
          $ref: '#/components/schemas/EmergencyCycle'
        contact:
          type: string
          title: Contact
        sms_sent:
          type: boolean
          title: Sms Sent
      additionalProperties: false
      type: object
      required:
      - emergency_state
      - attempt
      - answered
      - cycle
      - contact
      - sms_sent
      title: EmergencyCallResult
      description: Emergency result without constraining the unresolved state enum.
    EmergencyCycle:
      type: string
      enum:
      - calling_5min
      - paused_10min
      - stopped
      title: EmergencyCycle
      description: Contract-defined stages in the emergency calling cycle.
    ErrorResponse:
      properties:
        status:
          type: string
          const: error
          title: Status
          default: error
        error:
          $ref: '#/components/schemas/PublicError'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      description: Synchronous Public API error envelope.
    JsonValue: {}
    LocationGetRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: LocationGetRequest
      description: Request the device's current location.
    LocationGetResult:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        captured_at:
          type: string
          format: date-time
          title: Captured At
      additionalProperties: false
      type: object
      required:
      - lat
      - lng
      - address
      - captured_at
      title: LocationGetResult
      description: Final result of a device location lookup.
    MusicPlayRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        song:
          type: string
          title: Song
        volume:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Volume
        spotify_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Spotify Uri
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      - song
      title: MusicPlayRequest
      description: Play a song, optionally setting its initial volume.
    MusicPlayResult:
      properties:
        track_id:
          type: string
          title: Track Id
        title:
          type: string
          title: Title
        artist:
          type: string
          title: Artist
        playback_state:
          type: string
          const: playing
          title: Playback State
        volume:
          type: integer
          title: Volume
      additionalProperties: false
      type: object
      required:
      - track_id
      - title
      - artist
      - playback_state
      - volume
      title: MusicPlayResult
      description: Final result after starting music playback.
    MusicStopRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: MusicStopRequest
      description: Stop active music playback.
    MusicStopResult:
      properties:
        playback_state:
          type: string
          const: stopped
          title: Playback State
      additionalProperties: false
      type: object
      required:
      - playback_state
      title: MusicStopResult
      description: Final result after stopping music playback.
    MusicVolumeRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        direction:
          anyOf:
          - $ref: '#/components/schemas/VolumeDirection'
          - type: 'null'
        level:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Level
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      title: MusicVolumeRequest
      description: Change volume by one relative direction or one absolute level.
    MusicVolumeResult:
      properties:
        volume_state:
          type: string
          const: changed
          title: Volume State
        level:
          type: integer
          title: Level
      additionalProperties: false
      type: object
      required:
      - volume_state
      - level
      title: MusicVolumeResult
      description: Final result after changing device volume.
    NavigationDestination:
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      additionalProperties: false
      type: object
      required:
      - address
      - lat
      - lng
      title: NavigationDestination
      description: Provider-normalized navigation destination.
    NavigationStartRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        destination:
          $ref: '#/components/schemas/Destination'
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      - destination
      title: NavigationStartRequest
      description: Start walking navigation to a destination.
    NavigationStartResult:
      properties:
        navigation_id:
          type: string
          title: Navigation Id
        navigation_state:
          type: string
          const: navigating
          title: Navigation State
        travel_mode:
          type: string
          const: walking
          title: Travel Mode
        destination:
          $ref: '#/components/schemas/NavigationDestination'
      additionalProperties: false
      type: object
      required:
      - navigation_id
      - navigation_state
      - travel_mode
      - destination
      title: NavigationStartResult
      description: Final result after starting walking guidance.
    NavigationStopRequest:
      properties:
        device_id:
          type: string
          title: Device Id
        request_id:
          type: string
          format: uuid
          title: Request Id
        navigation_id:
          type: string
          title: Navigation Id
      additionalProperties: false
      type: object
      required:
      - device_id
      - request_id
      - navigation_id
      title: NavigationStopRequest
      description: Stop a navigation session.
    NavigationStopResult:
      properties:
        navigation_id:
          type: string
          title: Navigation Id
        navigation_state:
          type: string
          const: stopped
          title: Navigation State
      additionalProperties: false
      type: object
      required:
      - navigation_id
      - navigation_state
      title: NavigationStopResult
      description: Final result after stopping guidance.
    OkResponse_AcceptedData_:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/AcceptedData'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[AcceptedData]
    OkResponse_RequestStatusData_ActionResult__:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        data:
          $ref: '#/components/schemas/RequestStatusData_ActionResult_'
      additionalProperties: false
      type: object
      required:
      - data
      title: OkResponse[RequestStatusData[ActionResult]]
    Operation:
      type: string
      enum:
      - ride_quote
      - ride_confirm
      - music_play
      - music_stop
      - music_volume
      - navigation_start
      - navigation_stop
      - emergency_call
      - contact_call
      - location_get
      - capabilities_get
      - call_answer
      - call_reject
      title: Operation
      description: Operations exposed in Public API responses.
    PriceEstimate:
      properties:
        currency:
          type: string
          title: Currency
        amount:
          type: number
          title: Amount
      additionalProperties: false
      type: object
      required:
      - currency
      - amount
      title: PriceEstimate
      description: Provider ride-price estimate.
    PublicError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - details
      title: PublicError
      description: Stable error representation shared by Public responses.
    RequestState:
      type: string
      enum:
      - processing
      - succeeded
      - failed
      - timed_out
      title: RequestState
      description: Public request lifecycle states.
    RequestStatusData_ActionResult_:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        operation:
          $ref: '#/components/schemas/Operation'
        request_state:
          $ref: '#/components/schemas/RequestState'
        result:
